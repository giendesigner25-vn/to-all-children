<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TO ALL CHILDREN - Admin Dashboard</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#172033;
}

header{
  background:#064e3b;
  color:white;
  padding:18px 30px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

header h1{
  margin:0;
  font-size:24px;
}

header button{
  border:0;
  background:#dc2626;
  color:white;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:25px;
}

.welcome{
  margin-bottom:25px;
}

.welcome h2{
  margin-bottom:5px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:18px;
  margin-bottom:30px;
}

.stat{
  background:white;
  padding:22px;
  border-radius:14px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.stat span{
  display:block;
  color:#64748b;
  margin-bottom:8px;
}

.stat strong{
  font-size:30px;
  color:#064e3b;
}

.section{
  background:white;
  padding:25px;
  border-radius:14px;
  margin-bottom:25px;
  box-shadow:0 4px 15px rgba(0,0,0,.07);
}

.section h2{
  margin-top:0;
}

form{
  display:grid;
  gap:12px;
}

input,textarea,select{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:8px;
  font-size:15px;
}

textarea{
  min-height:120px;
  resize:vertical;
}

.primary{
  background:#16a34a;
  color:white;
  border:0;
  padding:13px 18px;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.secondary{
  background:#475569;
  color:white;
  border:0;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.danger{
  background:#dc2626;
  color:white;
  border:0;
  padding:9px 13px;
  border-radius:7px;
  cursor:pointer;
}

.story{
  border:1px solid #e2e8f0;
  border-radius:10px;
  padding:18px;
  margin-top:15px;
}

.story h3{
  margin-top:0;
  color:#064e3b;
}

.actions{
  display:flex;
  gap:10px;
  margin-top:15px;
  flex-wrap:wrap;
}

.hidden{
  display:none;
}

.message{
  padding:12px;
  border-radius:8px;
  margin-bottom:15px;
  display:none;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.user{
  padding:14px;
  border-bottom:1px solid #e2e8f0;
}

.user:last-child{
  border-bottom:0;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  header{
    padding:15px;
  }

  .container{
    padding:15px;
  }

  .stats{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 TO ALL CHILDREN — Admin</h1>
  <button id="logoutBtn">Logout</button>
</header>

<div class="container">

  <div class="welcome">
    <h2>Admin Dashboard</h2>
    <div id="adminName">Loading...</div>
  </div>

  <div id="message" class="message"></div>

  <div class="stats">

    <div class="stat">
      <span>Stories</span>
      <strong id="storyCount">0</strong>
    </div>

    <div class="stat">
      <span>Users</span>
      <strong id="userCount">0</strong>
    </div>

    <div class="stat">
      <span>Favorites</span>
      <strong id="favoriteCount">0</strong>
    </div>

    <div class="stat">
      <span>Reading Progress</span>
      <strong id="progressCount">0</strong>
    </div>

  </div>

  <div class="section">

    <h2 id="formTitle">➕ Add New Story</h2>

    <form id="storyForm">

      <input type="hidden" id="storyId">

      <input
        id="titleEn"
        placeholder="Story title in English"
        required
      >

      <input
        id="titleRw"
        placeholder="Story title in Kinyarwanda"
        required
      >

      <textarea
        id="bodyEn"
        placeholder="Story content in English"
        required
      ></textarea>

      <textarea
        id="bodyRw"
        placeholder="Story content in Kinyarwanda"
        required
      ></textarea>

      <input
        id="category"
        placeholder="Category e.g. Kindness"
        value="General"
      >

      <div class="actions">

        <button
          type="submit"
          class="primary"
          id="saveBtn"
        >
          Add Story
        </button>

        <button
          type="button"
          class="secondary hidden"
          id="cancelBtn"
        >
          Cancel Edit
        </button>

      </div>

    </form>

  </div>

  <div class="section">

    <h2>📚 Story Library</h2>

    <div id="stories">
      Loading stories...
    </div>

  </div>

  <div class="section">

    <h2>👥 Users</h2>

    <div id="users">
      Loading users...
    </div>

  </div>

</div>

<script>

const token=localStorage.getItem('tac_token');

if(!token){
  window.location.href='/admin.html';
}

const headers={
  'Authorization':'Bearer '+token,
  'Content-Type':'application/json'
};

const message=document.getElementById('message');

function showMessage(text,type='success'){
  message.textContent=text;
  message.className='message '+type;

  setTimeout(()=>{
    message.className='message';
  },4000);
}

async function api(url,options={}){
  const response=await fetch(url,{
    ...options,
    headers:{
      ...headers,
      ...(options.headers||{})
    }
  });

  const data=await response.json().catch(()=>({}));

  if(response.status===401 || response.status===403){
    localStorage.removeItem('tac_token');
    window.location.href='/admin.html';
    throw new Error('Admin access required');
  }

  if(!response.ok){
    throw new Error(data.error||'Request failed');
  }

  return data;
}

async function loadAdmin(){

  try{

    const me=await api('/api/auth/me');

    if(me.role!=='admin'){
      localStorage.removeItem('tac_token');
      window.location.href='/admin.html';
      return;
    }

    document.getElementById('adminName').textContent=
      'Welcome, '+me.name+' ('+me.email+')';

    await loadStats();
    await loadStories();
    await loadUsers();

  }catch(error){
    showMessage(error.message,'error');
  }

}

async function loadStats(){

  const data=await api('/api/stats');

  document.getElementById('storyCount').textContent=data.stories;
  document.getElementById('userCount').textContent=data.users;
  document.getElementById('favoriteCount').textContent=data.favorites;
  document.getElementById('progressCount').textContent=data.progress;

}

async function loadStories(){

  const stories=await api('/api/stories');

  const box=document.getElementById('stories');

  if(!stories.length){
    box.innerHTML='<p>No stories yet.</p>';
    return;
  }

  box.innerHTML=stories.map(story=>`

    <div class="story">

      <h3>${escapeHtml(story.title_en)}</h3>

      <strong>
        ${escapeHtml(story.title_rw)}
      </strong>

      <p>
        ${escapeHtml(story.body_en).substring(0,300)}
        ${story.body_en.length>300?'...':''}
      </p>

      <small>
        Category: ${escapeHtml(story.category||'General')}
      </small>

      <div class="actions">

        <button
          class="secondary"
          onclick="editStory(${story.id})"
        >
          ✏️ Edit
        </button>

        <button
          class="danger"
          onclick="deleteStory(${story.id})"
        >
          🗑️ Delete
        </button>

      </div>

    </div>

  `).join('');

}

async function loadUsers(){

  const users=await api('/api/users');

  const box=document.getElementById('users');

  if(!users.length){
    box.innerHTML='<p>No users yet.</p>';
    return;
  }

  box.innerHTML=users.map(user=>`

    <div class="user">

      <strong>
        ${escapeHtml(user.name)}
      </strong>

      <br>

      <span>
        ${escapeHtml(user.email)}
      </span>

      <br>

      <small>
        Role: ${escapeHtml(user.role)}
        · Favorites: ${user.favorites}
        · Progress: ${user.progress_items}
      </small>

    </div>

  `).join('');

}

async function editStory(id){

  const stories=await api('/api/stories');

  const story=stories.find(s=>s.id===id);

  if(!story)return;

  document.getElementById('storyId').value=story.id;
  document.getElementById('titleEn').value=story.title_en;
  document.getElementById('titleRw').value=story.title_rw;
  document.getElementById('bodyEn').value=story.body_en;
  document.getElementById('bodyRw').value=story.body_rw;
  document.getElementById('category').value=story.category||'General';

  document.getElementById('formTitle').textContent='✏️ Edit Story';
  document.getElementById('saveBtn').textContent='Update Story';
  document.getElementById('cancelBtn').classList.remove('hidden');

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}

document.getElementById('storyForm').addEventListener(
  'submit',
  async function(e){

    e.preventDefault();

    const id=document.getElementById('storyId').value;

    const story={
      title_en:document.getElementById('titleEn').value.trim(),
      title_rw:document.getElementById('titleRw').value.trim(),
      body_en:document.getElementById('bodyEn').value.trim(),
      body_rw:document.getElementById('bodyRw').value.trim(),
      category:document.getElementById('category').value.trim()||'General'
    };

    try{

      if(id){

        await api('/api/stories/'+id,{
          method:'PUT',
          body:JSON.stringify(story)
        });

        showMessage('Story updated successfully.');

      }else{

        await api('/api/stories',{
          method:'POST',
          body:JSON.stringify(story)
        });

        showMessage('Story added successfully.');

      }

      resetForm();
      await loadStats();
      await loadStories();

    }catch(error){

      showMessage(error.message,'error');

    }

  }
);

async function deleteStory(id){

  if(!confirm('Are you sure you want to delete this story?')){
    return;
  }

  try{

    await api('/api/stories/'+id,{
      method:'DELETE'
    });

    showMessage('Story deleted.');

    await loadStats();
    await loadStories();

  }catch(error){

    showMessage(error.message,'error');

  }

}

function resetForm(){

  document.getElementById('storyForm').reset();
  document.getElementById('storyId').value='';

  document.getElementById('category').value='General';

  document.getElementById('formTitle').textContent=
    '➕ Add New Story';

  document.getElementById('saveBtn').textContent=
    'Add Story';

  document.getElementById('cancelBtn').classList.add('hidden');

}

document.getElementById('cancelBtn').addEventListener(
  'click',
  resetForm
);

document.getElementById('logoutBtn').addEventListener(
  'click',
  async function(){

    try{
      await api('/api/auth/logout',{
        method:'POST'
      });
    }catch(e){}

    localStorage.removeItem('tac_token');
    window.location.href='/admin.html';

  }
);

function escapeHtml(value){

  return String(value||'')
    .replaceAll('&','&amp;')
    .replaceAll('<','&lt;')
    .replaceAll('>','&gt;')
    .replaceAll('"','&quot;')
    .replaceAll("'","&#039;");

}

loadAdmin();

</script>

</body>
</html>
