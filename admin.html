<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TO ALL CHILDREN - Admin Login</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#064e3b,#16a34a);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
}

.card{
  width:100%;
  max-width:430px;
  background:white;
  border-radius:22px;
  padding:35px;
  box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.logo{
  text-align:center;
  font-size:42px;
  margin-bottom:8px;
}

h1{
  text-align:center;
  margin:0;
  color:#064e3b;
  font-size:28px;
}

.subtitle{
  text-align:center;
  color:#666;
  margin:8px 0 28px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
  color:#333;
}

input{
  width:100%;
  padding:14px;
  border:1px solid #ccc;
  border-radius:10px;
  font-size:16px;
}

input:focus{
  outline:none;
  border-color:#16a34a;
  box-shadow:0 0 0 3px rgba(22,163,74,.15);
}

button{
  width:100%;
  margin-top:22px;
  padding:15px;
  border:0;
  border-radius:10px;
  background:#16a34a;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}

button:hover{
  background:#15803d;
}

button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.message{
  margin-top:18px;
  padding:12px;
  border-radius:10px;
  display:none;
  text-align:center;
}

.error{
  display:block;
  background:#fee2e2;
  color:#991b1b;
}

.success{
  display:block;
  background:#dcfce7;
  color:#166534;
}

.back{
  display:block;
  text-align:center;
  margin-top:22px;
  color:#064e3b;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">📚</div>

  <h1>Admin Login</h1>

  <div class="subtitle">
    TO ALL CHILDREN
  </div>

  <form id="loginForm">

    <label for="email">Admin Email</label>
    <input
      id="email"
      type="email"
      placeholder="Enter admin email"
      required
      autocomplete="username"
    >

    <label for="password">Password</label>
    <input
      id="password"
      type="password"
      placeholder="Enter admin password"
      required
      autocomplete="current-password"
    >

    <button id="loginButton" type="submit">
      Login to Admin
    </button>

  </form>

  <div id="message" class="message"></div>

  <a class="back" href="/">
    ← Back to website
  </a>

</div>

<script>
const form=document.getElementById('loginForm');
const email=document.getElementById('email');
const password=document.getElementById('password');
const button=document.getElementById('loginButton');
const message=document.getElementById('message');

function showMessage(text,type){
  message.textContent=text;
  message.className='message '+type;
}

form.addEventListener('submit',async function(e){

  e.preventDefault();

  button.disabled=true;
  button.textContent='Logging in...';

  showMessage('Checking admin account...','success');

  try{

    const response=await fetch('/api/auth/login',{
      method:'POST',
      headers:{
        'Content-Type':'application/json'
      },
      body:JSON.stringify({
        email:email.value.trim(),
        password:password.value
      })
    });

    const data=await response.json();

    if(!response.ok){
      throw new Error(data.error||'Login failed');
    }

    if(!data.user || data.user.role!=='admin'){

      if(data.token){
        await fetch('/api/auth/logout',{
          method:'POST',
          headers:{
            'Authorization':'Bearer '+data.token
          }
        });
      }

      throw new Error('This account is not an administrator.');
    }

    localStorage.setItem('tac_token',data.token);

    showMessage('Login successful. Opening Admin Dashboard...','success');

    setTimeout(function(){
      window.location.href='/admin-dashboard.html';
    },700);

  }catch(error){

    showMessage(error.message,'error');

    button.disabled=false;
    button.textContent='Login to Admin';
  }

});
</script>

</body>
</html>
