<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TO ALL CHILDREN — Parent Portal</title><link rel="stylesheet" href="portal.css"></head><body><header><img src="logo.png"><div><strong>TO ALL CHILDREN</strong><span>Ku Bana Bose</span></div><a href="/">Admin / Home</a></header><main><section id="auth" class="card"><div class="tabs"><button id="loginTab" class="active">Log In</button><button id="registerTab">Create Account</button></div><form id="loginForm"><h1>Welcome back 👋</h1><p>Continue your child's reading journey.</p><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Password" required><button>Log In</button><small id="loginMsg"></small></form><form id="registerForm" class="hidden"><h1>Create a parent account 🌈</h1><p>Save favorites and reading progress.</p><input id="regName" placeholder="Parent name" required><input id="regEmail" type="email" placeholder="Email" required><input id="regPassword" type="password" minlength="6" placeholder="Password (6+ characters)" required><button>Create Account</button><small id="regMsg"></small></form></section><section id="account" class="hidden"><div class="hero card"><div><p class="eyebrow">PARENT PORTAL</p><h1>Hello, <span id="userName"></span>! 👋</h1><p>Your child's bilingual reading space.</p></div><button id="logout" class="outline">Log out</button></div><div class="grid"><div class="card"><h2>⭐ My Favorites</h2><div id="favorites"></div></div><div class="card"><h2>📖 Continue Reading</h2><div id="progress"></div></div></div><div class="card"><h2>📚 Story Library</h2><div id="stories"></div></div></section></main><script src="portal.js"></script></body></html>
