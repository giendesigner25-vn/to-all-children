:root{--blue:#2563eb;--green:#16a34a;--yellow:#fbbf24;--pink:#ec4899;--ink:#183153;--bg:#f6fbff}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--ink)}header{background:white;border-bottom:1px solid #e5eef7;position:sticky;top:0;z-index:5}.nav{max-width:1180px;margin:auto;padding:12px 20px;display:flex;align-items:center;gap:18px}.logo{font-weight:900;font-size:21px;color:#2563eb}.logo span{color:#16a34a}.nav button,.btn{border:0;border-radius:14px;padding:11px 15px;font-weight:700;cursor:pointer}.nav button{background:#eef5ff;color:#2563eb}.nav .spacer{flex:1}.hero{max-width:1180px;margin:28px auto;padding:34px 24px;border-radius:28px;background:linear-gradient(135deg,#eaf5ff,#fff9dc);display:grid;grid-template-columns:1.2fr .8fr;gap:20px;align-items:center}.hero h1{font-size:46px;margin:0 0 10px}.hero p{font-size:18px;line-height:1.6}.hero-art{font-size:110px;text-align:center}.section{max-width:1180px;margin:30px auto;padding:0 20px}.section h2{font-size:30px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.input{padding:12px 14px;border:1px solid #d9e5ef;border-radius:12px;background:white;flex:1;min-width:220px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}.card{background:white;border:1px solid #e4edf5;border-radius:22px;padding:20px;box-shadow:0 8px 25px #18315310}.card h3{margin:8px 0}.tag{display:inline-block;background:#eef9ef;color:#16803a;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:700}.actions{display:flex;gap:8px;margin-top:15px}.primary{background:var(--blue);color:white}.green{background:var(--green);color:white}.light{background:#eef5ff;color:var(--blue)}.fav{margin-left:auto;font-size:21px;background:none}.modal{position:fixed;inset:0;background:#102a4388;display:none;align-items:center;justify-content:center;padding:20px;z-index:20}.modal.show{display:flex}.box{background:white;border-radius:24px;max-width:850px;width:100%;max-height:90vh;overflow:auto;padding:26px}.close{float:right;border:0;background:#f1f5f9;border-radius:50%;width:36px;height:36px}.storytext{font-size:20px;line-height:1.8;white-space:pre-wrap}.readerbar{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.progress{height:10px;background:#e7edf4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--green)}.profile{background:white;border-radius:22px;padding:22px;border:1px solid #e4edf5}.hidden{display:none}.toast{position:fixed;right:20px;bottom:20px;background:#183153;color:white;padding:13px 16px;border-radius:13px;display:none;z-index:30}@media(max-width:750px){.hero{grid-template-columns:1fr}.hero h1{font-size:34px}.nav{flex-wrap:wrap}}
</style></head><body>
<header><div class="nav"><div class="logo">🌈 TO ALL <span>CHILDREN</span></div><button onclick="home()">Stories</button><button onclick="showAccount()">My Account</button><div class="spacer"></div><span id="who"></span><button id="installBtn" class="light" style="display:none" onclick="installApp()">📲 Install</button><button id="shareBtn" class="light" onclick="shareSite()">↗ Share</button><button id="authBtn" onclick="openAuth()">Login</button></div></header>
<main id="app"><section class="hero"><div><h1>Stories for Every Child 📚</h1><p>Inkuru nziza ku bana bose — soma mu <b>English</b> cyangwa <b>Kinyarwanda</b>, ukomeze aho wari ugeze kandi ubike inkuru ukunda.</p><button class="btn primary" onclick="document.getElementById('stories').scrollIntoView()">Start Reading</button></div><div class="hero-art">👧🏾 📖 👦🏿<br>🌈 ⭐ 🦋</div></section><section class="section" id="stories"><h2>📚 Story Library</h2><div class="toolbar"><input class="input" id="search" placeholder="Search stories / Shakisha inkuru..." oninput="renderStories()"><button class="btn light" onclick="setLang('en')">English</button><button class="btn light" onclick="setLang('rw')">Kinyarwanda</button></div><div class="grid" id="storyGrid"></div></section></main>
<div class="modal" id="modal"><div class="box" id="box"></div></div><div class="toast" id="toast"></div>
<script>
let stories=[],lang='en',token=localStorage.getItem('tac_token'),me=null,current=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
async function api(url,opt={}){opt.headers={...(opt.headers||{}),...(token?{Authorization:'Bearer '+token}:{})};if(opt.body&&typeof opt.body!=='string'){opt.headers['Content-Type']='application/json';opt.body=JSON.stringify(opt.body)}let r=await fetch(url,opt);let j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}
async function load(){stories=await api('/api/stories');if(token){try{me=await api('/api/auth/me')}catch(e){logout(false)}}updateNav();renderStories()}
function updateNav(){document.getElementById('who').textContent=me?'Hi, '+me.name:'';document.getElementById('authBtn').textContent=me?'Logout':'Login';document.getElementById('authBtn').onclick=me?()=>logout(true):openAuth}
function setLang(x){lang=x;renderStories()}
function renderStories(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=stories.filter(s=>(s.title_en+' '+s.title_rw+' '+s.category).toLowerCase().includes(q));document.getElementById('storyGrid').innerHTML=arr.map(s=>`<article class="card"><span class="tag">${esc(s.category)}</span><h3>${esc(lang==='en'?s.title_en:s.title_rw)}</h3><p>${esc((lang==='en'?s.body_en:s.body_rw).slice(0,130))}...</p><div class="actions"><button class="btn primary" onclick="readStory(${s.id})">📖 Read</button><button class="btn fav" onclick="toggleFav(${s.id})">☆</button></div></article>`).join('')||'<p>No stories found.</p>'}
async function readStory(id){current=stories.find(s=>s.id===id);let p=0;if(me){try{let ps=await api('/api/me/progress');let x=ps.find(a=>a.story_id===id);p=x?.percent||0}catch(e){}}renderReader(p);openModal()}
function renderReader(p=0){let title=lang==='en'?current.title_en:current.title_rw,body=lang==='en'?current.body_en:current.body_rw;document.getElementById('box').innerHTML=`<button class="close" onclick="closeModal()">×</button><span class="tag">${esc(current.category)}</span><h1>${esc(title)}</h1><div class="readerbar"><button class="btn light" onclick="setReaderLang('en')">🇬🇧 English</button><button class="btn light" onclick="setReaderLang('rw')">🇷🇼 Kinyarwanda</button><button class="btn green" onclick="speak()">🔊 Read Aloud</button><button class="btn light" onclick="stopSpeak()">⏹ Stop</button><button class="btn fav" onclick="toggleFav(${current.id})">⭐ Favorite</button></div><div class="progress"><i style="width:${p}%"></i></div><p>${p}% read</p><div class="storytext" id="storyText">${esc(body)}</div><div class="readerbar"><button class="btn light" onclick="saveProgress(Math.max(0,${p}-10))">← Back</button><button class="btn primary" onclick="saveProgress(Math.min(100,${p}+25))">Continue →</button></div>`}
function setReaderLang(x){lang=x;renderReader(0)}
function speak(){let t=document.getElementById('storyText')?.innerText;if(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=lang==='rw'?'rw-RW':'en-US';speechSynthesis.speak(u)}}function stopSpeak(){speechSynthesis.cancel()}
async function saveProgress(p){if(!me){openAuth();return}await api('/api/me/progress/'+current.id,{method:'PUT',body:{percent:p}});renderReader(p);toast('Progress saved!');}
async function toggleFav(id){if(!me){openAuth();return}let r=await api('/api/me/favorites/'+id,{method:'POST'});toast(r.favorite?'Added to favorites ⭐':'Removed from favorites');}
function openModal(){document.getElementById('modal').classList.add('show')}function closeModal(){document.getElementById('modal').classList.remove('show');stopSpeak()}
function openAuth(){document.getElementById('box').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>👨‍👩‍👧 Parent Account</h2><div class="toolbar"><button class="btn primary" onclick="authForm('login')">Login</button><button class="btn light" onclick="authForm('register')">Create Account</button></div><div id="authForm"></div>`;authForm('login');openModal()}
function authForm(type){document.getElementById('authForm').innerHTML=`<input class="input" id="name" placeholder="Your name" ${type==='login'?'style="display:none"':''}><br><br><input class="input" id="email" placeholder="Email"><br><br><input class="input" id="password" type="password" placeholder="Password (6+ characters)"><br><br><button class="btn primary" onclick="submitAuth('${type}')">${type==='login'?'Login':'Create Account'}</button>`}
async function submitAuth(type){try{let b={email:email.value,password:password.value};if(type==='register')b.name=name.value;let r=await api('/api/auth/'+type,{method:'POST',body:b});token=r.token;localStorage.setItem('tac_token',token);me=r.user;closeModal();updateNav();toast('Welcome to TO ALL CHILDREN! 🌈')}catch(e){toast(e.message)}}
async function showAccount(){if(!me){openAuth();return}let fav=await api('/api/me/favorites'),prog=await api('/api/me/progress');document.getElementById('box').innerHTML=`<button class="close" onclick="closeModal()">×</button><h2>👤 ${esc(me.name)}</h2><div class="profile"><p><b>Email:</b> ${esc(me.email)}</p><p><b>Favorites:</b> ${fav.length}</p><p><b>Stories started:</b> ${prog.length}</p></div><h3>⭐ My Favorites</h3><div class="grid">${fav.map(s=>`<div class="card"><h3>${esc(lang==='en'?s.title_en:s.title_rw)}</h3><button class="btn primary" onclick="readStory(${s.id})">Read</button></div>`).join('')||'<p>No favorites yet.</p>'}</div><h3>📖 Reading Progress</h3><div class="grid">${prog.map(p=>`<div class="card"><h3>${esc(lang==='en'?p.title_en:p.title_rw)}</h3><div class="progress"><i style="width:${p.percent}%"></i></div><p>${p.percent}% complete</p></div>`).join('')||'<p>No reading progress yet.</p>'}</div>`;openModal()}
async function logout(close=true){try{await api('/api/auth/logout',{method:'POST'})}catch(e){}localStorage.removeItem('tac_token');token=null;me=null;updateNav();if(close)toast('Logged out')}
function home(){closeModal();window.scrollTo({top:0,behavior:'smooth'})}function toast(s){let x=document.getElementById('toast');x.textContent=s;x.style.display='block';setTimeout(()=>x.style.display='none',2200)}load();
</script><script>
let deferredInstall=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredInstall=e;document.getElementById('installBtn').style.display='inline-block'});
async function installApp(){if(!deferredInstall)return;deferredInstall.prompt();await deferredInstall.userChoice;deferredInstall=null;document.getElementById('installBtn').style.display='none'}
async function shareSite(){try{await navigator.share({title:'TO ALL CHILDREN — Ku Bana Bose',text:'Stories for every child in English and Kinyarwanda.',url:location.href})}catch(e){try{await navigator.clipboard.writeText(location.href);toast('Website link copied! 🔗')}catch(_){toast('Copy this page link from your browser.')}}}
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));
</script></body></html>
